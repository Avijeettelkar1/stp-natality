name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: uv sync --extra ci --frozen

      - name: Run Black (code formatting check)
        run: uv run black --check src/ scripts/ tests/

      - name: Run isort (import order check)
        run: uv run isort --check-only src/ scripts/ tests/

      - name: Run Flake8 (linting)
        run: uv run flake8 src/ scripts/ tests/ --max-line-length=88

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing

      - name: Build serving image
        run: docker build -f deployment/Dockerfile -t stp-natality-api:test .

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
