[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stp-natality"
version = "0.1.0"
description = "MLOps prototype for newborn birth weight prediction"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pyarrow>=14",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.1,<5",
    "joblib>=1.3",
    "mlflow>=2.9",
    "optuna>=3.4",
    "fastapi>=0.108",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.25",
    "httpx>=0.26",
]

[project.optional-dependencies]
ci = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.12",
    "flake8>=7",
    "isort>=5.13",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.12",
    "flake8>=7",
    "isort>=5.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.28",
]
api = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.1,<5",
    "joblib>=1.3",
    "fastapi>=0.108",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.25",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv]
default-groups = []

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
